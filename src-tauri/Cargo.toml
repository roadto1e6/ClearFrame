[package]
name = "clearframe"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
tempfile = "3"
regex = "1"

[[bin]]
name = "clearframe-calm"
path = "src/main.rs"
